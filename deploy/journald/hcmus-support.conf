# Drop-in for journald: install as /etc/systemd/journald.conf.d/hcmus-support.conf, then
#   systemctl restart systemd-journald && journalctl --vacuum-size=500M
# The v1 server had accumulated a 2.9 GB journal; this keeps it bounded.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemMaxFileSize=50M
