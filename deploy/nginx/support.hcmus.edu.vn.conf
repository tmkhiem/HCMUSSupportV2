# nginx site for HCMUS Support V2.   Install: /etc/nginx/sites-available/support.hcmus.edu.vn.conf
#                                              + symlink in /etc/nginx/sites-enabled/
#
# Design: nginx is a thin TLS terminator + reverse proxy. The ASP.NET Core app (127.0.0.1:5080)
# serves BOTH the Vite SPA (wwwroot, with the index.html fallback for client-side routes) and /api.
# Why app-served instead of nginx serving the static files:
#   - one artifact per release: `dotnet publish` carries the frontend, so the SPA and the API can
#     never be out of step, and the symlink switch + rollback in deploy.ps1 covers both;
#   - no second copy of the static root to keep in sync (v1 had a separate /var/www/.../html);
#   - the traffic (~3k requests/day) does not justify the extra moving part.
# nginx still adds what the app should not do itself: TLS, HTTP->HTTPS, www->apex, HSTS and
# security headers, gzip, request-rate limits, upload cap, long-lived caching of hashed assets.
#
# TLS certificate: the v1 certbot cert covers ONLY support.hcmus.edu.vn. Reissue it with www too:
#   certbot certonly --webroot -w /var/www/certbot --expand \
#       -d support.hcmus.edu.vn -d www.support.hcmus.edu.vn
# (server-bootstrap.sh does this). Both server names below use the same certificate files.
#
# Needs nginx >= 1.25.1 for the `http2 on;` directive (Debian 13). On older nginx, replace
# `listen 443 ssl;` + `http2 on;` with `listen 443 ssl http2;` (server-bootstrap.sh does this itself).

# ---- rate limiting (zones must live in the http context; sites-enabled files are included there) ----
# /api/auth/*: login redirect, callback, session probe. Per client IP.
limit_req_zone $binary_remote_addr zone=hcmus_auth:10m rate=30r/m;
# /api/integration/*: the HCMUS-network Sync tool posts batches from ONE address; allow a burst.
limit_req_zone $binary_remote_addr zone=hcmus_integration:10m rate=120r/m;
limit_req_status 429;

upstream hcmus_app {
    server 127.0.0.1:5080;
    keepalive 16;
}

# ---- 80: ACME challenge + redirect everything to https://support.hcmus.edu.vn ----
server {
    listen 80;
    listen [::]:80;
    server_name support.hcmus.edu.vn www.support.hcmus.edu.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://support.hcmus.edu.vn$request_uri;
    }
}

# Anything else that reaches this host by IP or a wrong Host header: drop it.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ---- 443 www -> apex (the Google OAuth redirect URI is registered for the apex only) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.support.hcmus.edu.vn;

    ssl_certificate     /etc/letsencrypt/live/support.hcmus.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.hcmus.edu.vn/privkey.pem;

    return 301 https://support.hcmus.edu.vn$request_uri;
}

# ---- 443 the application ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name support.hcmus.edu.vn;

    ssl_certificate     /etc/letsencrypt/live/support.hcmus.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.hcmus.edu.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:hcmus_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No OCSP stapling: Let's Encrypt has retired OCSP.

    server_tokens off;

    # Uploads: notification attachments and recipient sheets. The app enforces its own size and
    # MIME allowlist; this is the outer cap (matches PLAN).
    client_max_body_size 25m;

    # ---- compression ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # ---- security headers ----
    # NOTE: add_header in a location block would DROP these server-level ones, so no location
    # below uses add_header. Caching is set with `expires`, which is not affected by that rule.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Kept from v1. Harmless with server-side OIDC (full-page redirect, no Google popup).
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # MUI/emotion injects <style> at runtime, hence 'unsafe-inline' for styles only (not scripts).
    # Google Fonts for the typeface; lh3.googleusercontent.com serves Google profile photos.
    # form-action lists accounts.google.com because /api/auth/login 302s there.
    # If the app ever sets its own Content-Security-Policy, remove this one (two policies intersect).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://lh3.googleusercontent.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'none'" always;
    # No Access-Control-Allow-* headers anywhere: the SPA and the API share one origin, so CORS is
    # not needed (v1 answered every OPTIONS with ACAO: *; that is gone).

    # ---- proxy defaults (inherited by every location below, none of which sets proxy_set_header) ----
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # dotfiles (.git, .env, ...) are never served; ACME is on port 80 only.
    location ~ /\.(?!well-known) {
        return 404;
    }

    location /api/auth/ {
        limit_req zone=hcmus_auth burst=20 nodelay;
        proxy_pass http://hcmus_app;
    }

    # Sync tool ingest (API-key authenticated). Batches can be large and slow to process.
    location /api/integration/ {
        limit_req zone=hcmus_integration burst=60 nodelay;
        proxy_pass http://hcmus_app;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://hcmus_app;
    }

    # Vite output: content-hashed file names, safe to cache for a year.
    location /assets/ {
        proxy_pass http://hcmus_app;
        proxy_hide_header Cache-Control;
        expires 1y;
    }

    # SPA shell (index.html for every client-side route), /healthz, everything else. Revalidate
    # every time so a new release's index.html (which names new hashed assets) is picked up at once.
    location / {
        proxy_pass http://hcmus_app;
        proxy_hide_header Cache-Control;
        expires -1;
    }
}
